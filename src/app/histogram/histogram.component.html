<div class="filters-container">
  <div class="row g-3">
    <div class="col-md-4">
      <label for="centrale-select" class="form-label">
        {{ 'HISTOGRAM.CENTRALE_LABEL' | translate }}
      </label>
      <select class="form-select" 
              [(ngModel)]="selectedCentrale" 
              (ngModelChange)="onCentraleChange()"
              id="centrale-select">
        <option value="">{{ 'HISTOGRAM.CENTRALE_PLACEHOLDER' | translate }}</option>
        <option *ngFor="let centrale of centrales" [value]="centrale">
          {{ centrale }}
        </option>
      </select>
    </div>

    <div class="col-md-4">
      <label for="tranche-select" class="form-label">
        {{ 'HISTOGRAM.TRANCHE_LABEL' | translate }}
      </label>
      <select class="form-select" 
              [(ngModel)]="tranche"
              (ngModelChange)="onTrancheChange()"
              id="tranche-select"
              [disabled]="!selectedCentrale">
        <option value="">{{ 'HISTOGRAM.TRANCHE_PLACEHOLDER' | translate }}</option>
        <option *ngFor="let tranche of getTranches()" [value]="tranche">
          {{ tranche }}
        </option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">{{ 'HISTOGRAM.PERIODE_LABEL' | translate }}</label>
      <div class="date-range-wrapper">
        <div class="date-range-inputs">
          <div class="date-range-field">
            <span class="date-range-label">{{ 'HISTOGRAM.DATE_FROM' | translate }}</span>
            <input type="date"
                   class="form-control"
                   [(ngModel)]="dateFrom"
                   (ngModelChange)="onDateChange()"
                   [min]="minDate"
                   [max]="dateTo || maxDate">
          </div>
          <span class="date-range-sep">→</span>
          <div class="date-range-field">
            <span class="date-range-label">{{ 'HISTOGRAM.DATE_TO' | translate }}</span>
            <input type="date"
                   class="form-control"
                   [(ngModel)]="dateTo"
                   (ngModelChange)="onDateChange()"
                   [min]="dateFrom || minDate"
                   [max]="maxDate">
          </div>
        </div>
        <button class="btn btn-sm text-nowrap"
                [class.btn-primary]="isFullPeriod"
                [class.btn-outline-secondary]="!isFullPeriod"
                (click)="resetToFullPeriod()">
          {{ 'HISTOGRAM.FULL_PERIOD' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>

<div class="chart-container mt-4" *ngIf="tranche || isTotalMode">
  <div *ngIf="isTotalMode && !tranche" class="total-mode-banner">
    {{ 'HISTOGRAM.TOTAL_MODE_TITLE' | translate }}
    <span>{{ 'HISTOGRAM.TOTAL_MODE_SUBTITLE' | translate }}</span>
  </div>
  <div id="container" style="width: 100%; height: 400px; position: relative;">
    <highcharts-chart
      *ngIf="!isChartLoading"
      [Highcharts]="Highcharts"
      [options]="chartOptions"
      [(update)]="updateChart"
      style="width: 100%; height: 400px; display: block;"
    ></highcharts-chart>

    <div *ngIf="isChartLoading" class="loading-overlay">
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>{{ 'HISTOGRAM.LOADING_MESSAGE' | translate }}</p>
      </div>
    </div>
  </div>
</div>
