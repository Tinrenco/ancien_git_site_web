<div class="search-wrapper">
  <div class="search-box">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>

    <input
      type="text"
      class="search-input"
      [placeholder]="'SEARCH.PLACEHOLDER' | translate"
      autocomplete="off"
      [(ngModel)]="query"
      (input)="onInput()"
      (keydown.enter)="onSubmit()"
      (keydown.escape)="showDropdown = false"
      (keydown.arrowdown)="moveSelection(1)"
      (keydown.arrowup)="moveSelection(-1)"
    >

    <button class="search-button" (click)="onSubmit()">{{ 'SEARCH.BUTTON' | translate }}</button>

    <div class="suggestions-dropdown" *ngIf="showDropdown">
      <div
        *ngFor="let s of suggestions; let i = index"
        class="suggestion-item"
        [class.active]="i === selectedIndex"
        (mouseenter)="selectedIndex = i"
        (click)="select(s)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="suggestion-icon" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        {{ s }}
      </div>
    </div>
  </div>
</div>
